title: |-
  Run CycloneDX Generator
summary: |
  Runs CycloneDX Generator to create SBOM (Software Bill Of Materials) file, in the CycloneDX format. This can be used by several other tools.
description: |
  This step will run CycloneDX Generator with a given configuration.
  More information on how to configure CycloneDX Generator: https://github.com/CycloneDX/cdxgen
website: https://github.com/HUK-COBURG/bitrise-steplib
source_code_url: https://github.com/HUK-COBURG/bitrise-steplib/tree/main/run-cdxgen
support_url: https://github.com/HUK-COBURG/bitrise-steplib/issues

project_type_tags:
  - ios
  - macos
  - android

type_tags:
  - utility

deps:
  brew:
    - name: node
  apt_get:
    - name: nodejs

toolkit:
  bash:
    entry_file: step.sh

inputs:
  - type: null
    opts:
      is_sensitive: false
      is_required: false
      summary: Project type. Please refer to https://cyclonedx.github.io/cdxgen/#/PROJECT_TYPES for supported languages/platforms.
      title: Type
  - specversion: null
    opts:
      is_sensitive: false
      is_required: false
      summary: CycloneDX Specification version to use.
      title: Spec-Version
  - only: null
    opts:
      is_sensitive: false
      is_required: false
      summary: Include components only containing this word in purl.
      title: Only
  - output: null
    opts:
      is_sensitive: false
      is_required: false
      summary: Output file. Default bom.json
      title: Output file
