title: |-
  Set bundle version
summary: |
  This step will use the GitLab API to get the number of commits and will set it as bundle version.
description: |
  This step will use the GitLab API to get the number of commits and will set it as bundle version.
  You have to hand over different values for it to work: commit hash, git url GitLab base url and token
website: https://github.com/HUK-COBURG/bitrise-steplib
source_code_url: https://github.com/HUK-COBURG/bitrise-steplib/tree/main/set-bundle-version
support_url: https://github.com/HUK-COBURG/bitrise-steplib/issues

project_type_tags:
  - ios
  - macos
  - android

type_tags:
  - utility

toolkit:
  bash:
    entry_file: step.sh

inputs:
  - repository_url: $GIT_REPOSITORY_URL
    opts:
      is_sensitive: false
      is_required: true
      summary: The GIT repository url.
      title: Repository url
  - gitlab_base_url: null
    opts:
      is_sensitive: false
      is_required: true
      summary: The base url of the GitLab instance.
      title: GitLab base url
  - gitlab_token: null
    opts:
      is_sensitive: false
      is_required: true
      summary: The token, used to communicate with GitLab.
      title: GitLab token
  - commit_hash: $GIT_CLONE_COMMIT_HASH
    opts:
      is_sensitive: false
      is_required: true
      summary: The SHA of the commit.
      title: Commit hash

outputs:
- BUNDLE_VERSION:
  opts:
    title: Bundle version
    description: The determined bundle version based.
